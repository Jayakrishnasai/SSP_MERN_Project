services:
  mongodb:
    image: mongo:4.4.6
    container_name: mongodb-server
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "echo 'db.runCommand({ ping: 1 }).ok' | mongo localhost:27017/test --quiet" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ssp-network

  backend-api:
    image: ${BACKEND_IMAGE_TAG:-jayakrishnasai/ssp-backend:latest}
    container_name: backend-api
    restart: unless-stopped
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3100
      DB_CONN_STR: ${DB_CONN_STR:-mongodb://mongodb:27017/perseverance}
      DB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      DB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      DB_AUTH_SOURCE: ${DB_AUTH_SOURCE:-admin}
      USE_DB_AUTH: ${USE_DB_AUTH:-false}
      FRONTEND_URL: ${FRONTEND_URL:-}
      ALLOW_ANY_ORIGIN: ${ALLOW_ANY_ORIGIN:-true}
    ports:
      - "3100:3100"

    # ✅ Secure backend (good practice)
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3100/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ssp-network

  frontend:
    image: ${FRONTEND_IMAGE_TAG:-jayakrishnasai/ssp-frontend:latest}
    container_name: frontend-webapp
    restart: unless-stopped
    init: true
    depends_on:
      backend-api:
        condition: service_healthy

    ports:
      - "80:8080"

    # ✅ ONLY /tmp needed (nginx uses this)
    tmpfs:
      - /tmp

    # ❌ DO NOT use read_only here (causes your crash)
    # read_only: true  ← removed intentionally

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ssp-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ssp-network
    depends_on:
      - backend-api

  grafana:
    image: grafana/grafana:12.4.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ssp-overview.json
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-smtp.gmail.com:587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-your_email@gmail.com}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-your_app_password}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-your_email@gmail.com}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-SSP Grafana}
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_STARTTLS_POLICY: OpportunisticStartTLS
      GRAFANA_ALERT_EMAIL_TO: ${GRAFANA_ALERT_EMAIL_TO:-alerts@example.com}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ssp-network
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - ssp-network

networks:
  ssp-network:
    driver: bridge

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
