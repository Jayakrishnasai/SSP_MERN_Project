name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Verify Node and NPM Versions
        run: |
          node -v
          npm -v

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Print Sonar Report URL
        run: |
          echo "Sonar Report:"
          cat .scannerwork/report-task.txt || true

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to AWS EC2
    needs: sonar-analysis
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Navigating to project..."
            cd ~/SSP_MERN_Project

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Stopping existing containers..."
            docker compose down --remove-orphans

            echo "Removing unused containers..."
            docker container prune -f

            echo "Rebuilding containers..."
            docker compose up -d --build --remove-orphans

            echo "Cleaning images..."
            docker image prune -f

            echo "Deployment completed. Running containers:"
            docker ps
