name: SSP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: jayakrishnasai/ssp-backend
  FRONTEND_IMAGE: jayakrishnasai/ssp-frontend

jobs:
  # ==========================================
  # 🧪 QUALITY CHECK (CI)
  # ==========================================
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - run: npm ci --prefix backend
      - run: npm test --prefix backend

      # Frontend
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend

  # ==========================================
  # 🔍 SONAR ANALYSIS
  # ==========================================
  sonar:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ==========================================
  # 🐳 DOCKER BUILD + TRIVY SCAN
  # ==========================================
  docker-build:
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build Backend
      - name: Build Backend
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Scan Backend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Build Frontend
      - name: Build Frontend
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      - name: Scan Frontend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Save images
      - name: Save Images
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -o backend.tar
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -o frontend.tar

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend.tar
            frontend.tar

  # ==========================================
  # 📦 DOCKER PUSH
  # ==========================================
  docker-push:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Images
        run: |
          docker load -i backend.tar
          docker load -i frontend.tar

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Tag latest
      - name: Tag Latest
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest

      # Push
      - run: docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
      - run: docker push ${{ env.BACKEND_IMAGE }}:latest
      - run: docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - run: docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ==========================================
  # 🚀 DEPLOY (EC2 SELF-HOSTED)
  # ==========================================
  deploy:
    needs: docker-push
    runs-on: [self-hosted, Test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Debug Runner
        run: |
          echo "Running on:"
          hostname
          docker --version

      - name: Pull Images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker pull prom/prometheus:latest
          docker pull grafana/grafana:latest
          docker pull prom/node-exporter:latest

      - name: Deploy Stack
        run: |
          cd /home/ubuntu/SSP_MERN_Project

          export BACKEND_IMAGE_TAG=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          export FRONTEND_IMAGE_TAG=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker compose down
          docker compose up -d --remove-orphans

      - name: Cleanup
        run: docker image prune -af
