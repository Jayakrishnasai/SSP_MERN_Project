name: SSP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: jayakrishnasai/ssp-backend
  FRONTEND_IMAGE: jayakrishnasai/ssp-frontend
  GRAFANA_HOST_PORT: "3000"

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend Tests
        run: |
          npm ci --prefix backend
          npm test --prefix backend

      - name: Frontend Tests
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend -- --coverage --watchAll=false

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info

  sonar:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  docker:
    needs: sonar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          exit-code: 1

      - name: Build Frontend
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      - name: Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          severity: CRITICAL
          exit-code: 1

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Images
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest

          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: docker
    runs-on: [self-hosted, Test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Sync Files
        run: |
          mkdir -p /home/ubuntu/SSP_MERN_Project
          cp docker-compose.yml /home/ubuntu/SSP_MERN_Project/
          cp -r prometheus /home/ubuntu/SSP_MERN_Project/
          mkdir -p /home/ubuntu/SSP_MERN_Project/grafana
          cp -r grafana/* /home/ubuntu/SSP_MERN_Project/grafana/

      - name: Deploy (with rollback)
        run: |
          cd /home/ubuntu/SSP_MERN_Project

          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          export BACKEND_IMAGE_TAG=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          export FRONTEND_IMAGE_TAG=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker compose up -d --remove-orphans || {
            echo "Deployment failed, rolling back..."
            docker compose down
            docker compose up -d
            exit 1
          }

      - name: Show Containers
        run: docker ps

      - name: Cleanup
        run: docker image prune -f

  smoke-test:
    needs: deploy
    runs-on: [self-hosted, Test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Health + Monitoring Checks
        run: |
          set -e
          trap 'echo "Dump logs"; docker logs prometheus; docker logs grafana; docker logs backend-api' ERR

          echo "Waiting for services..."
          until curl -s http://127.0.0.1:9090/-/healthy; do sleep 3; done

          curl -f http://127.0.0.1:3100/health
          curl -f http://127.0.0.1/
          curl -f http://127.0.0.1:9090/-/healthy
          curl -f http://127.0.0.1:${{ env.GRAFANA_HOST_PORT }}/api/health

          echo "Checking metrics..."
          curl -s http://127.0.0.1:3100/metrics | grep process_cpu_seconds_total

          echo "Checking Prometheus..."
          curl -s http://127.0.0.1:9090/api/v1/query?query=up | grep '"value"'

          echo "Checking targets..."
          curl -s http://127.0.0.1:9090/api/v1/targets | grep '"health":"up"'

  notify:
    needs: [smoke-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always()

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "SSP Pipeline - ${{ job.status }}"
          body: |
            Pipeline Status: ${{ job.status }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: your_email@gmail.com
          from: SSP CI/CD
