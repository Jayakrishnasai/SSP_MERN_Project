name: SSP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: jayakrishnasai/ssp-backend
  FRONTEND_IMAGE: jayakrishnasai/ssp-frontend
  GRAFANA_HOST_PORT: "3001"

jobs:
# ==========================================
# 🧪 QUALITY CHECK
# ==========================================
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: npm ci --prefix backend
      - run: npm test --prefix backend

      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend -- --coverage --watchAll=false

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info

# ==========================================
# 🔍 SONAR
# ==========================================
  sonar:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

# ==========================================
# 🐳 BUILD + TRIVY
# ==========================================
  docker:
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Scan Backend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Build Frontend
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      - name: Scan Frontend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          severity: "CRITICAL"
          exit-code: "1"

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Images
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ${{ env.FRONTEND_IMAGE }}:latest

          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

# ==========================================
# 🚀 DEPLOY
# ==========================================
  deploy:
    needs: docker
    runs-on: [self-hosted, Test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Sync configuration files
        run: |
          mkdir -p /home/ubuntu/SSP_MERN_Project
          cp docker-compose.yml /home/ubuntu/SSP_MERN_Project/
          cp -r prometheus /home/ubuntu/SSP_MERN_Project/
          mkdir -p /home/ubuntu/SSP_MERN_Project/grafana/provisioning/datasources
          mkdir -p /home/ubuntu/SSP_MERN_Project/grafana/provisioning/dashboards
          mkdir -p /home/ubuntu/SSP_MERN_Project/grafana/dashboards
          cp -r grafana/provisioning /home/ubuntu/SSP_MERN_Project/grafana/
          cp -r grafana/dashboards /home/ubuntu/SSP_MERN_Project/grafana/
          test -f /home/ubuntu/SSP_MERN_Project/grafana/dashboards/node-exporter.json

      - name: Restart application stack
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          cd /home/ubuntu/SSP_MERN_Project

          export BACKEND_IMAGE_TAG=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          export FRONTEND_IMAGE_TAG=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker compose down
          docker compose up -d --remove-orphans

      - run: docker image prune -af

# ==========================================
# ✅ SMOKE TEST
# ==========================================
  smoke-test:
    needs: deploy
    runs-on: [self-hosted, Test]
    steps:
      - name: Health Check
        run: curl -f http://127.0.0.1:3100/health

      - name: Metrics Check
        run: curl -f http://127.0.0.1:3100/metrics

      - name: Frontend Check
        run: curl -f http://127.0.0.1/

      - name: Prometheus Check
        run: curl -f http://127.0.0.1:9090/-/healthy

      - name: Grafana Check
        run: curl -f http://127.0.0.1:${{ env.GRAFANA_HOST_PORT }}/api/health
