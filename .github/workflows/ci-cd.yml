name: SSP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: jayakrishnasai/ssp-backend
  FRONTEND_IMAGE: jayakrishnasai/ssp-frontend

jobs:
  # ==========================================
  # 🧪 QUALITY STAGE (CI - GitHub Hosted)
  # ==========================================
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install Backend
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit

      - name: Test Backend
        working-directory: backend
        run: npm test -- --runInBand

      # Frontend
      - name: Install Frontend
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Test Frontend
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --coverage --watchAll=false --runInBand

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info

  # ==========================================
  # 🔍 SONAR ANALYSIS (CI)
  # ==========================================
  sonar:
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # 🐳 DOCKER BUILD & TRIVY SCAN (DevSecOps)
  # ==========================================
  docker-build:
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} ./backend

      - name: Run Trivy Scan on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image
        run: docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} ./frontend

      - name: Run Trivy Scan on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save Docker Images
        run: |
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -o backend-image.tar
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -o frontend-image.tar

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar
          retention-days: 1

  # ==========================================
  # 📦 DOCKER PUSH
  # ==========================================
  docker-push:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Download Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Backend
        run: docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push Frontend
        run: docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ==========================================
  # 🚀 DEPLOY (CD - EC2 with Monitoring)
  # ==========================================
  deploy:
    needs: docker-push
    runs-on: [self-hosted, Test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Debug Runner
        run: |
          hostname
          docker --version

      - name: Pull Images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker pull prom/prometheus:latest
          docker pull grafana/grafana:latest
          docker pull prom/node-exporter:latest

      - name: Deploy Stack
        run: |
          cd /home/ubuntu/SSP_MERN_Project

          export BACKEND_IMAGE_TAG=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          export FRONTEND_IMAGE_TAG=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker compose down
          docker compose up -d --remove-orphans

      - name: Cleanup Old Images
        run: docker image prune -af
