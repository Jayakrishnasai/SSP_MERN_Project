name: SSP CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  BACKEND_IMAGE: jayakrishnasai/ssp-backend
  FRONTEND_IMAGE: jayakrishnasai/ssp-frontend

jobs:

# ==========================================
# 🧪 QUALITY STAGE (CI - GitHub Hosted)
# ==========================================
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend
      - name: Install Backend
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit

      - name: Test Backend
        working-directory: backend
        run: npm test -- --runInBand

      # Frontend
      - name: Install Frontend
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Test Frontend
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --coverage --watchAll=false --runInBand

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage/lcov.info
            frontend/coverage/lcov.info

# ==========================================
# 🔍 SONAR ANALYSIS (CI)
# ==========================================
  sonar:
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# ==========================================
# 🐳 DOCKER BUILD & PUSH (CI)
# ==========================================
  docker:
    needs: sonar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

# ==========================================
# 🚀 DEPLOY (CD - SELF HOSTED EC2)
# ==========================================
  deploy:
    needs: docker
    runs-on: [self-hosted, ec2]   # 🔥 THIS IS THE KEY CHANGE
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Debug Runner Info
        run: |
          echo "Running on:"
          hostname
          uname -a

      - name: Pull Latest Images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Deploy Application
        run: |
          cd /home/ubuntu/SSP_MERN_Project

          export BACKEND_IMAGE_TAG=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          export FRONTEND_IMAGE_TAG=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          docker compose down
          docker compose up -d --remove-orphans

      - name: Cleanup Old Images
        run: docker image prune -af
