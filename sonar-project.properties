sonar.projectKey=SSP_MERN_Project
sonar.organization=jayakrishnasai


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=SSP_MERN_Project
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/src/**/*.test.js,frontend/src/**/__tests__/**

# Exclude generated artifacts and dependencies from analysis.
sonar.exclusions=backend/coverage/**,frontend/build/**,frontend/node_modules/**,backend/node_modules/**,frontend/src/tailwind-output.css,backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/__tests__/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
